data_dir: ./data
model_dir: ./models   # 模型本地目录（不入 git）；缺失时启动自动从 modelscope 下载
database_url: postgresql+psycopg://asr_app:asr_dev_password@127.0.0.1:25432/asr  # docker compose up -d 起库；可用环境变量 ASR_DATABASE_URL 覆盖
# 转写引擎：llamacpp（默认，GGUF 量化混合引擎，CPU 提速内存省约 8 成）
# 或 funasr（纯 torch 慢但零准备）。llamacpp 需先跑：bash scripts/setup_llamacpp.sh
# （下载约 1.7G 量化模型 + 编译补丁版二进制，装到 models/llamacpp/，跑一次即可）
# 下面三项不填即用脚本默认位置；量化档也按 CPU 架构自动选（x86 用 q4km，Apple 芯片用 q8_0）
# llamacpp_bin: models/llamacpp/bin/llama-funasr-cli
# llamacpp_dir: models/llamacpp/gguf
# llamacpp_llm: qwen3-0.6b-q4km.gguf
max_workers: 2          # 全局并发转写数（同会话内始终串行）
llm_quantize: false     # 转写模型 LLM 分支 int8 动态量化：省内存、CPU 提速；逐字时间戳走 CTC 分支不受影响，改后建议跑 diarize_report 校准一次
speaker_threshold: 0.45  # 认人余弦阈值（音频内合并与跨录音认人共用）：偏高会把同一人拆成多个，偏低会把不同人并成一个
speaker_window_threshold: 0.65 # 窗口聚类阈值：偏高拆人、偏低并人；拿真实录音跑 python -m app.diarize_report 看扫描表校准
speaker_min_enroll_ms: 6000  # 新建说话人的最低素材：不足时不达标只并入最像的已有说话人，避免碎片声纹（调低则更容易建新卡，幽灵声纹变多）
max_upload_mb: 50

# 租户身份只由 api_key 推导（唯一身份层级，无注册接口）。
# 启动校验会拒绝占位符和短 key：用 openssl rand -hex 32 生成后填入。
tenants:
  - name: saas_a
    api_key: CHANGE_ME_KEY_A
  - name: saas_b
    api_key: CHANGE_ME_KEY_B
