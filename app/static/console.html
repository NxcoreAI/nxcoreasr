<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nxcore-asr 测试台</title>
<style>
  :root { --line:#e2e2e2; --muted:#777; --accent:#1a56db; --ok:#067647; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1b1b1b; background:#fafafa; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); }
  header .title { font-weight:600; margin-right:8px; }
  input, select, button, textarea { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  button.rec-on { background:var(--bad); border-color:var(--bad); color:#fff; }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px 20px; max-width:1180px; }
  section, aside > div, .netsec { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .netsec { grid-column:1 / -1; }
  h2 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:12px; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; }
  .badge { display:inline-block; padding:0 8px; border-radius:10px; font-size:12px; line-height:18px; white-space:nowrap; }
  .st-pending_upload, .st-uploaded, .st-queued { background:#f2f4f7; color:#667085; }
  .st-processing { background:#eef4ff; color:var(--accent); }
  .st-done { background:#ecfdf3; color:var(--ok); }
  .st-failed { background:#fef3f2; color:var(--bad); }
  .utt { padding:6px 0; border-bottom:1px solid #f0f0f0; }
  .utt:last-child { border-bottom:none; }
  .utt .rec { color:var(--accent); font-size:12px; margin-right:6px; white-space:nowrap; }
  .utt .rec:empty { display:none; }
  .utt .who { font-weight:600; margin-right:8px; }
  .utt .t { color:var(--muted); font-size:12px; margin-left:8px; }
  .spk { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 4px; border-bottom:1px solid #f0f0f0; border-radius:6px; }
  .spk:last-child { border-bottom:none; }
  .spk .nm { font-weight:600; cursor:pointer; }
  .spk.on { background:#eef4ff; }
  .spk.on .nm { color:var(--accent); }
  .task { padding:6px 0; border-bottom:1px solid #f0f0f0; }
  .task:last-child { border-bottom:none; }
  .task .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .task pre, #reqOut { background:#fafafa; border:1px solid var(--line); border-radius:6px; padding:8px; font-size:12px; overflow:auto; max-height:280px; margin:6px 0 0; white-space:pre-wrap; word-break:break-all; }
  #netlog { max-height:220px; overflow:auto; }
  #netlog div { padding:1px 0; }
  #netlog .bad { color:var(--bad); }
  #taskStatus { font-size:13px; }
  #err { color:var(--bad); font-size:13px; padding:0 20px; }
</style>
</head>
<body>
<header>
  <span class="title">nxcore-asr 测试台</span>
  <input id="key" placeholder="API Key" size="22">
  <span id="health" class="muted"></span>
</header>
<div id="err"></div>
<main>
  <div>
    <section>
      <h2>会话</h2>
      <div class="bar">
        <select id="sessions"></select>
        <input id="extid" placeholder="external_id" size="12">
        <button id="btnReg">注册会话</button>
        <button id="btnDel" class="danger">删除会话</button>
      </div>
      <div id="sesMeta" class="meta"></div>
    </section>
    <section>
      <h2>录音与上传</h2>
      <div class="bar">
        <button id="btnRec" class="primary">开始录音</button>
        <input type="file" id="file" accept="audio/*">
        <button id="btnUpload">上传文件</button>
        <span id="taskStatus" class="muted"></span>
      </div>
    </section>
    <section>
      <h2>任务 <button id="btnTasks">刷新</button></h2>
      <div id="tasks" class="muted">—</div>
    </section>
    <section>
      <h2>转写结果 <button id="btnRefresh">刷新</button> <span id="ver" class="muted"></span> <span id="filterTag"></span></h2>
      <div id="results" class="muted">—</div>
      <div class="bar" style="margin-top:8px"><button id="btnMore" hidden>加载更多</button></div>
    </section>
  </div>
  <aside>
    <div>
      <h2>说话人</h2>
      <div id="speakers" class="muted">—</div>
      <div class="bar" style="margin-top:10px">
        <select id="mFrom"></select>
        <span>并入</span>
        <select id="mInto"></select>
        <button id="btnMerge">合并</button>
      </div>
    </div>
    <div>
      <h2>通用请求</h2>
      <div class="bar">
        <select id="reqMethod">
          <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
        </select>
        <input id="reqPath" placeholder="/v1/…" size="20" value="/v1/health">
      </div>
      <textarea id="reqBody" rows="3" placeholder='{"external_id": "x"}' style="width:100%;margin-top:8px"></textarea>
      <div class="bar" style="margin-top:8px"><button id="btnReq" class="primary">发送</button></div>
      <pre id="reqOut" hidden></pre>
    </div>
  </aside>
  <div class="netsec">
    <details>
      <summary>请求记录</summary>
      <div id="netlog" class="muted" style="margin-top:8px"></div>
    </details>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const err = m => { $("err").textContent = m || ""; };

$("key").value = localStorage.getItem("asr_key") || "";
$("key").addEventListener("change", () => localStorage.setItem("asr_key", $("key").value.trim()));

const calls = [];
function logCall(method, path, status, ms) {
  calls.unshift({ method, path, status, ms, t: new Date() });
  if (calls.length > 50) calls.pop();
  const box = $("netlog");
  box.innerHTML = "";
  for (const c of calls) {
    const d = document.createElement("div");
    const tm = document.createElement("span");
    tm.textContent = c.t.toLocaleTimeString() + " ";
    const m = document.createElement("b");
    m.textContent = c.method + " ";
    const p = document.createElement("span");
    p.textContent = c.path + " → ";
    const s = document.createElement("span");
    s.textContent = `${c.status} ${c.ms}ms`;
    if (c.status >= 400) s.className = "bad";
    d.append(tm, m, p, s);
    box.appendChild(d);
  }
}

async function http(url, opts = {}) {
  opts.headers = Object.assign({ "Authorization": "Bearer " + $("key").value.trim() }, opts.headers || {});
  const t0 = performance.now();
  const r = await fetch(url, opts);
  logCall(opts.method || "GET", url.replace(location.origin, ""), r.status,
          Math.round(performance.now() - t0));
  return r;
}

async function api(path, opts = {}) {
  const r = await http("/v1" + path, opts);
  if (!r.ok) {
    let d = ""; try { d = (await r.json()).detail; } catch {}
    throw new Error(`${r.status} ${d || r.statusText}`);
  }
  return r.json();
}
const jpost = (path, body, method = "POST") => api(path, {
  method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
});

const sid = () => $("sessions").value;
const extById = {}, metaById = {};

async function loadHealth() {
  try {
    const h = await api("/health");
    const avg = h.avg_duration_ms != null ? (h.avg_duration_ms / 1000).toFixed(1) + "s" : "—";
    $("health").textContent =
      `引擎 ${h.engine} · 队列 ${h.queue.queued}/${h.queue.workers} · 完成 ${h.done} · 失败 ${h.failed} · 均耗 ${avg}`;
  } catch { $("health").textContent = ""; }
}

function renderSesMeta() {
  const m = metaById[sid()];
  $("sesMeta").textContent = m
    ? `v${m.version} · ${m.audio_count} 段 · ${m.done_count} 成功 · ${m.failed_count} 失败 · ${m.speaker_count} 说话人 · ${m.created_at || ""}`
    : "";
}

async function loadSessions(selectId) {
  const prevSid = sid();
  const d = await api("/sessions");
  const sel = $("sessions");
  sel.innerHTML = "";
  for (const s of d.sessions) {
    extById[s.session_id] = s.external_id;
    metaById[s.session_id] = s;
    const o = document.createElement("option");
    o.value = s.session_id;
    o.textContent = `${s.external_id}（${s.done_count}/${s.audio_count}）`;
    sel.appendChild(o);
  }
  if (selectId) sel.value = selectId;
  if (sid() !== prevSid) { filterPerson = null; renderFilterTag(); }
  renderSesMeta();
  await Promise.all([refresh(), loadTasks()]);
}

let resAfter = 0, resMore = false, filterPerson = null;
const taskSeqById = {};

function renderFilterTag() {
  const el = $("filterTag");
  el.textContent = "";
  if (!filterPerson) return;
  el.append("筛选：" + filterPerson.name + " ");
  const x = document.createElement("button");
  x.textContent = "清除";
  x.onclick = () => setFilter(null).catch(e => err(e.message));
  el.appendChild(x);
}

async function setFilter(p) {
  filterPerson = p;
  renderFilterTag();
  resAfter = 0;
  await loadResults(true);
  loadSpeakers().catch(e => err(e.message));
}

async function loadResults(reset) {
  let url = `/sessions/${sid()}/results?after=${resAfter}`;
  if (filterPerson) url += `&person_id=${encodeURIComponent(filterPerson.person_id)}`;
  const res = await api(url);
  $("ver").textContent = "v" + res.session_version;
  renderFilterTag();
  const box = $("results");
  if (reset) box.innerHTML = "";
  if (reset && !res.utterances.length) box.textContent = "—";
  for (const u of res.utterances) {
    const div = document.createElement("div");
    div.className = "utt";
    const rec = document.createElement("span");
    rec.className = "rec";
    const ts = taskSeqById[u.task_id];
    if (ts != null) rec.textContent = "录音#" + ts;
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = u.person_name;
    const tx = document.createElement("span");
    tx.className = "tx";
    tx.textContent = u.text;
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = `${(u.start_ms/1000).toFixed(1)}–${(u.end_ms/1000).toFixed(1)}s`;
    div.append(rec, who, tx, t);
    box.appendChild(div);
  }
  box.classList.toggle("muted", reset && !res.utterances.length);
  resAfter = res.next_cursor;
  resMore = res.utterances.length >= 500;
  $("btnMore").hidden = !resMore;
}

async function loadSpeakers() {
  const spk = await api(`/sessions/${sid()}/speakers`);
  const sb = $("speakers");
  sb.classList.toggle("muted", !spk.speakers.length);
  sb.innerHTML = "";
  if (!spk.speakers.length) sb.textContent = "—";
  const mf = $("mFrom"), mi = $("mInto");
  mf.innerHTML = mi.innerHTML = "";
  for (const s of spk.speakers) {
    const row = document.createElement("div");
    row.className = "spk";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = s.display_name || s.auto_label;
    const isActive = () => filterPerson && filterPerson.person_id === s.person_id;
    nm.onclick = () =>
      setFilter(isActive() ? null : { person_id: s.person_id, name: s.display_name || s.auto_label })
        .catch(e => err(e.message));
    if (isActive()) row.classList.add("on");
    row.appendChild(nm);
    const meta = document.createElement("span");
    meta.className = "muted";
    meta.textContent = `${s.utterance_count} 句 · ${s.audio_count} 段`;
    row.appendChild(meta);

    const setName = async (name) => {
      try {
        await jpost(`/sessions/${sid()}/speakers/${s.person_id}/name`, { name }, "PUT");
        await loadSpeakers();
      } catch (e) { err(e.message); }
    };
    const btnName = document.createElement("button");
    btnName.textContent = s.named ? "改名" : "命名";
    btnName.onclick = () => {
      row.innerHTML = "";
      const inp = document.createElement("input");
      inp.value = s.display_name || "";
      inp.size = 10;
      inp.maxLength = 64;
      const ok = document.createElement("button");
      ok.className = "primary";
      ok.textContent = "保存";
      ok.onclick = () => setName(inp.value.trim() || null);
      const cancel = document.createElement("button");
      cancel.textContent = "取消";
      cancel.onclick = () => loadSpeakers().catch(e => err(e.message));
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") ok.onclick();
        if (e.key === "Escape") cancel.onclick();
      });
      row.append(inp, ok, cancel);
      inp.focus();
    };
    row.appendChild(btnName);
    if (s.named) {
      const btnClear = document.createElement("button");
      btnClear.textContent = "清除";
      btnClear.onclick = () => setName(null);
      row.appendChild(btnClear);
    }
    for (const child of s.merged_person_ids) {
      const b = document.createElement("button");
      b.textContent = "撤销合并";
      b.onclick = async () => {
        try { await jpost(`/sessions/${sid()}/speakers/${child}/unmerge`, {}); await loadSpeakers(); }
        catch (e) { err(e.message); }
      };
      row.appendChild(b);
    }
    sb.appendChild(row);
    for (const sel of [mf, mi]) {
      const o = document.createElement("option");
      o.value = s.person_id;
      o.textContent = s.display_name || s.auto_label;
      sel.appendChild(o);
    }
  }
}

async function loadTasks() {
  if (!sid()) { $("tasks").textContent = "—"; return; }
  const d = await api(`/sessions/${sid()}/tasks`);
  for (const t of d.tasks) taskSeqById[t.task_id] = t.seq;
  const box = $("tasks");
  box.innerHTML = "";
  box.classList.toggle("muted", !d.tasks.length);
  if (!d.tasks.length) box.textContent = "—";
  for (const t of d.tasks) {
    const row = document.createElement("div");
    row.className = "task";
    const bar = document.createElement("div");
    bar.className = "row";
    const seq = document.createElement("span");
    seq.textContent = t.seq == null ? "未编号" : "#" + t.seq;
    const badge = document.createElement("span");
    badge.className = "badge st-" + t.status;
    badge.textContent = t.status;
    const info = document.createElement("span");
    info.className = "muted";
    info.textContent = [
      t.duration_ms != null ? (t.duration_ms / 1000).toFixed(1) + "s" : null,
      (t.done_at || t.created_at || "").slice(11, 19),
    ].filter(Boolean).join(" · ");
    bar.append(seq, badge, info);

    const btnDetail = document.createElement("button");
    btnDetail.textContent = "详情";
    let open = false, pre = null;
    btnDetail.onclick = async () => {
      open = !open;
      btnDetail.textContent = open ? "收起" : "详情";
      if (open && !pre) {
        pre = document.createElement("pre");
        pre.textContent = "加载中…";
        row.appendChild(pre);
        try { pre.textContent = JSON.stringify(await api(`/asr-jobs/${t.task_id}`), null, 2); }
        catch (e) { pre.textContent = e.message; }
      }
      if (pre) pre.style.display = open ? "" : "none";
    };
    bar.appendChild(btnDetail);

    if (t.status === "failed") {
      const btnRetry = document.createElement("button");
      btnRetry.textContent = "重试";
      btnRetry.onclick = async () => {
        err("");
        try { await jpost(`/tasks/${t.task_id}/retry`, {}); await loadTasks(); }
        catch (e) { err(e.message); }
      };
      bar.appendChild(btnRetry);
      const em = document.createElement("span");
      em.className = "muted";
      em.textContent = (t.error || "").slice(0, 80);
      bar.appendChild(em);
    }
    row.appendChild(bar);
    box.appendChild(row);
  }
}

async function refresh() {
  if (!sid()) {
    $("results").textContent = "—"; $("speakers").textContent = "—";
    $("ver").textContent = ""; $("btnMore").hidden = true;
    return;
  }
  resAfter = 0;
  await loadTasks();  // 先拿任务编号，结果里的"录音#N"标签才有映射
  await Promise.all([loadResults(true), loadSpeakers()]);
}

$("btnReg").onclick = async () => {
  err("");
  const ext = $("extid").value.trim();
  if (!ext) return err("请填 external_id");
  try { const d = await jpost("/sessions", { external_id: ext }); await loadSessions(d.session_id); }
  catch (e) { err(e.message); }
};

$("btnDel").onclick = async () => {
  if (!sid() || !confirm("删除该会话？结果与说话人库将全部清除，不可恢复。")) return;
  try { await api(`/sessions/${sid()}`, { method: "DELETE" }); await loadSessions(); loadHealth(); }
  catch (e) { err(e.message); }
};

$("btnRefresh").onclick = () => refresh().catch(e => err(e.message));
$("btnTasks").onclick = () => loadTasks().catch(e => err(e.message));
$("btnMore").onclick = () => loadResults(false).catch(e => err(e.message));
$("btnMerge").onclick = async () => {
  err("");
  const from = $("mFrom").value, into = $("mInto").value;
  if (!from || !into) return err("请先选择说话人");
  try { await jpost(`/sessions/${sid()}/speakers/merge`, { from_person: from, into_person: into }); await loadSpeakers(); }
  catch (e) { err(e.message); }
};

$("btnReq").onclick = async () => {
  err("");
  const method = $("reqMethod").value;
  const path = $("reqPath").value.trim();
  if (!path) return err("请填接口路径");
  const opts = { method, headers: {} };
  const body = $("reqBody").value.trim();
  if (body && method !== "GET" && method !== "DELETE") {
    opts.headers["Content-Type"] = "application/json";
    opts.body = body;
  }
  const out = $("reqOut");
  out.hidden = false;
  out.textContent = "请求中…";
  try {
    const r = await http(path, opts);
    const text = await r.text();
    let s = `${r.status} ${r.statusText || ""}`;
    try { s += "\n" + JSON.stringify(JSON.parse(text), null, 2); } catch { s += "\n" + text; }
    out.textContent = s;
  } catch (e) { out.textContent = "请求失败：" + e.message; }
};

async function uploadBlob(blob, targetSid) {
  const s = targetSid || sid();
  const ext = extById[s];
  if (!ext) return err("请先注册/选择会话");
  err("");
  // 四步：建 job（同 external_id 落同一会话）→ 授权 → PUT 裸字节 → 确认入队
  const job = await jpost("/asr-jobs", { external_id: ext });
  if (job.status === "pending_upload" || job.status === "uploaded") {
    const authz = await jpost(`/asr-jobs/${job.job_id}/upload-authorization`, {});
    const r = await http(authz.upload_url, {
      method: "PUT",
      headers: { "Content-Type": "application/octet-stream" },
      body: blob,
    });
    if (!r.ok) throw new Error(`直传失败 ${r.status}`);
    await jpost(`/asr-jobs/${job.job_id}/upload-complete`, {});
  }
  $("taskStatus").textContent = "排队中…";
  const poll = async () => {
    const t = await api(`/tasks/${job.job_id}`);
    if (t.status === "done") {
      $("taskStatus").textContent = `完成，耗时 ${(t.duration_ms/1000).toFixed(1)}s`;
      await refresh(); await loadTasks(); await loadSessions(sid()); loadHealth();
    } else if (t.status === "failed") {
      $("taskStatus").textContent = "失败：" + t.error;
      await loadTasks();
    } else {
      $("taskStatus").textContent = t.status === "processing" ? "转写中…" : "排队中…";
      setTimeout(() => poll().catch(e => err(e.message)), 1500);
    }
  };
  poll().catch(e => err(e.message));
}

$("btnUpload").onclick = () => {
  const f = $("file").files[0];
  if (!f) return err("请先选择音频文件");
  uploadBlob(f).catch(e => err(e.message));
};

// 每段独立起一个完整录制再停：webm 分片只有首片带文件头，后端解不开，必须整文件切换
let recorder = null, stream = null, segTimer = null, chunks = [], recSid = null, recN = 0;

function startSegment() {
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    if (blob.size) {
      recN += 1;
      $("taskStatus").textContent = `上传第 ${recN} 段…`;
      uploadBlob(blob, recSid).catch(e => err(e.message));
    }
    if (stream) startSegment();
    else {
      recorder = null;
      $("btnRec").textContent = "开始录音";
      $("btnRec").classList.replace("rec-on", "primary");
      for (const id of ["sessions", "btnReg", "btnDel"]) $(id).disabled = false;
    }
  };
  recorder.start();
}

$("btnRec").onclick = async () => {
  err("");
  if (recorder || stream) {
    clearInterval(segTimer); segTimer = null;
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    if (recorder && recorder.state !== "inactive") recorder.stop();
    return;
  }
  recSid = sid();
  if (!recSid) return err("请先注册/选择会话");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { return err("无法访问麦克风：" + e.message); }
  // 录音目标已锁定：期间禁用会话切换/注册/删除，避免看着别的会话以为没结果
  recN = 0;
  for (const id of ["sessions", "btnReg", "btnDel"]) $(id).disabled = true;
  startSegment();
  segTimer = setInterval(() => {
    if (recorder && recorder.state === "recording") recorder.stop();
  }, 60000);
  $("btnRec").textContent = "录音中（每分钟自动上传）";
  $("btnRec").classList.replace("primary", "rec-on");
};

(async () => {
  await loadHealth();
  if ($("key").value) loadSessions().catch(e => err(e.message));
})();
</script>
</body>
